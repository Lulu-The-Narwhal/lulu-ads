[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lulu-ads"
version = "0.1.1"
description = "Disclosed sponsored slots for MCP servers and AI agent tools. Ships data, never directives. Fail-open by design."
readme = "../README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.24.0"]

[project.urls]
Homepage = "https://getlulu.dev"
Documentation = "https://getlulu.dev/docs"
Source = "https://github.com/Lulu-The-Narwhal/lulu-ads"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "fastmcp>=3.0.0"]
integrations-dev = ["langchain>=1.0", "crewai>=1.9.1"]

[tool.hatch.build.targets.wheel]
packages = ["lulu_ads"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
